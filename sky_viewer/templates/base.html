<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}空模様ビューワー{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>
<body>
    <nav>
        <a href="/">ホーム</a> |
        <a href="/map">地図</a> |
        <!-- <a href="/howto">使い方</a> | -->
        <a href="/history">履歴</a>
        <button id="toggle-theme">🌗 モード切替</button>
    </nav>
    <main>
        {% block content %}{% endblock %}
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flashes">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
    </main>
</body>
</html>
